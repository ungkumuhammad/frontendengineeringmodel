<text x="620" y="652" class="h" text-anchor="start">HOW TO READ</text>
<text x="620" y="675" class="sm" text-anchor="start">Flow  FT-J01 = liquid mass flow &amp; density at the manifold (this IS the 'slower flowrate' being studied).</text>
<text x="620" y="696" class="sm" text-anchor="start">Vapour  FT-V01 = displaced vapour returned to ship; FT-B01 = vapour to BOG compressors. Both are needed to separate displacement from generation.</text>
<text x="620" y="717" class="sm" text-anchor="start">Heat in  PT/TT-S04/J01 → T07/T08 (line ends), TT-L01/TI-L02 (line &amp; ambient), JI-S05 (pump power) give flash across pump + line + nozzle.</text>
<text x="620" y="738" class="sm" text-anchor="start">Tank  PT-T01, LT-T03, TT-T05/T06 give shore tank heat-leak by mass balance, independent of rate.  Ship  LT/PT/TT-S01..03 give ship-side BOG.</text>
<text x="620" y="759" class="sm" text-anchor="start">Calculation basis and worked slow-rate case: see docs/nh3-discharge-bog.md</text>
</svg>